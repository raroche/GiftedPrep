# Netlify configuration for GiftedPrep.
#
# There is no build step. The repository root IS the site: plain HTML, CSS,
# ES modules and JSON. Netlify serves it as-is.

[build]
  publish = "."
  # Nothing is compiled, but everything is checked. A syntax error or a broken
  # question used to be able to reach production; now the deploy fails first.
  command = "npm run verify"

[build.environment]
  NODE_VERSION = "22"

# None of these filenames carry a content hash, so any max-age above zero lets a
# browser pair a fresh index.html with stale CSS and JS. That shipped a real bug:
# the Parent Guide's language button rendered from new HTML while the cached CSS
# had no rule to place it and the cached JS had no handler to run it. The whole
# site is a few hundred kilobytes, so always revalidate; a 304 is cheap and the
# page can never be served half-updated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # The app loads nothing from anywhere else, so lock it down completely.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"

# No catch-all redirect on purpose. Routing is entirely hash based, so a deep
# link never reaches the server and needs no rewrite. A catch-all would instead
# turn a missing question file into a 200 with an HTML body, which surfaces as
# a confusing JSON parse error rather than an honest 404.
