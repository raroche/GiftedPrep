<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="CurioZoo">
  <title>CurioZoo</title>
  <!-- A favicon cannot inherit the page's colours and is shown at 16px, so this
       is a self-contained tile: the ears of the full mark are dropped, and so
       is the seam along the mouth, because a 2.6 line turns to mud at that
       size. The mouth's curve survives, because a silhouette does. -->
