  <path d="M 13.5 51 Q 32 58 50.5 51" fill="none" stroke="#8E3F17"
        stroke-width="15" stroke-linecap="round"/>
  <circle cx="21" cy="29" r="12" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>
  <circle cx="43" cy="29" r="12" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>
  <circle cx="24" cy="27.5" r="5.4" fill="#2B2926"/>
  <circle cx="46" cy="27.5" r="5.4" fill="#2B2926"/>
  <circle cx="26.2" cy="25.3" r="1.9" fill="#FFFFFF"/>
  <circle cx="48.2" cy="25.3" r="1.9" fill="#FFFFFF"/>
</svg>
