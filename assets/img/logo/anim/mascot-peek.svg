<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="The CurioZoo mascot peeks over the zoo wall">
  <title>CurioZoo mascot — peek</title>
  <desc>The mascot rises from behind the wall, looks left and right, blinks, and ducks back down. Loops.</desc>

  <!-- Animated with SMIL, not CSS. The site ships style-src 'self', which
       silently drops a <style> block inside an SVG, so a CSS keyframe here
       would simply never run. SMIL is not a style, so it survives, and it
       also plays when the file is used as <img src> or as a splash asset in
       a native shell, which a CSS animation on an outer element cannot.

       One cycle is 6s and every timeline below shares that dur with
       repeatCount="indefinite", so the parts stay in step without a master
       clock. keyTimes are therefore fractions of 7 seconds.

       SMIL cannot read prefers-reduced-motion. Anything that renders where a
       child may have asked for less movement must use modules/mascot.js
       instead, which is CSS driven and stops. See anim/README.md. -->

  <clipPath id="cz-peek-clip">
    <!-- Cuts the head off inside the wall, so ducking hides it completely
         rather than sliding a pair of eyes out below the bricks. -->
    <rect x="-20" y="-60" width="104" height="112"/>
  </clipPath>

  <g clip-path="url(#cz-peek-clip)">
    <g>
      <!-- Rise, hold, duck. The small negative step at 0.13 is an overshoot:
           coming to a dead stop at the top reads as a lift, overshooting by
           three units and settling reads as a creature. -->
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="6s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;   0.04;  0.13;   0.17;  0.20; 0.84; 0.93; 1"
        values="0 46; 0 46; 0 -3.5; 0 1.2; 0 0; 0 0; 0 46; 0 46"
        keySplines="0 0 1 1; 0.16 0.84 0.34 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0 0 1 1; 0.5 0 0.85 0.5; 0 0 1 1"/>

      <!-- Ears. They twitch once just after the head settles, which is the
           beat that stops the rise looking like a lift. -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          dur="6s" repeatCount="indefinite"
          keyTimes="0; 0.21; 0.25; 0.29; 0.33; 0.37; 1"
          values="0 19 19; 0 19 19; -10 19 19; 7 19 19; -3 19 19; 0 19 19; 0 19 19"/>
        <circle cx="19" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          dur="6s" repeatCount="indefinite"
          keyTimes="0; 0.21; 0.25; 0.29; 0.33; 0.37; 1"
          values="0 45 19; 0 45 19; 10 45 19; -7 45 19; 3 45 19; 0 45 19; 0 45 19"/>
        <circle cx="45" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/>
      </g>

      <!-- Eye whites. Blinking squashes ry rather than dropping an eyelid
           shape over the top: a lid would have to be painted the colour of
           whatever is behind the mascot, and that colour changes with the
           theme and with wherever the file is dropped. Squashing needs no
           second colour and is correct on any background.
           non-scaling-stroke keeps the outline 2.6 wide while it squashes,
           so a shut eye is a clean line and not a lens. -->
      <ellipse cx="21.5" cy="27" rx="11" ry="11" fill="#FFFFFF" stroke="#2B2926"
               stroke-width="2.6" vector-effect="non-scaling-stroke">
        <animate attributeName="ry" dur="6s" repeatCount="indefinite"
          keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
          values="11; 11; 0.9; 11; 0.9; 11; 11"/>
      </ellipse>
      <ellipse cx="42.5" cy="27" rx="11" ry="11" fill="#FFFFFF" stroke="#2B2926"
               stroke-width="2.6" vector-effect="non-scaling-stroke">
        <animate attributeName="ry" dur="6s" repeatCount="indefinite"
          keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
          values="11; 11; 0.9; 11; 0.9; 11; 11"/>
      </ellipse>

      <!-- Pupils and glints ride in one group so both eyes look the same way
           at the same moment. Cross-eyed is the failure this prevents. -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          dur="6s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;   0.24; 0.31;   0.42;   0.50;   0.61;   0.68; 1"
          values="0 0; 0 0; -4 0.8; -4 0.8; 4.6 0.8; 4.6 0.8; 0 0; 0 0"
          keySplines="0 0 1 1; 0.3 0 0.2 1; 0 0 1 1; 0.3 0 0.2 1; 0 0 1 1; 0.3 0 0.2 1; 0 0 1 1"/>
        <ellipse cx="24.5" cy="25.5" rx="4.6" ry="4.6" fill="#2B2926">
          <animate attributeName="ry" dur="6s" repeatCount="indefinite"
            keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
            values="4.6; 4.6; 0.3; 4.6; 0.3; 4.6; 4.6"/>
        </ellipse>
        <ellipse cx="45.5" cy="25.5" rx="4.6" ry="4.6" fill="#2B2926">
          <animate attributeName="ry" dur="6s" repeatCount="indefinite"
            keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
            values="4.6; 4.6; 0.3; 4.6; 0.3; 4.6; 4.6"/>
        </ellipse>
        <circle cx="26.3" cy="23.6" r="1.6" fill="#FFFFFF">
          <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
            keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
            values="1; 1; 0; 1; 0; 1; 1"/>
        </circle>
        <circle cx="47.3" cy="23.6" r="1.6" fill="#FFFFFF">
          <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
            keyTimes="0; 0.715; 0.735; 0.755; 0.775; 0.795; 1"
            values="1; 1; 0; 1; 0; 1; 1"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- The wall is drawn last so the head passes behind it. -->
  <path d="M 15 46 Q 32 56 49 46" fill="none" stroke="var(--gp-accent, #BA5828)"
        stroke-width="22" stroke-linecap="round"/>
  <!-- The mouth. The seam is drawn about the origin and the group carries the
       translate, so an additive scale here pivots on the seam's end points:
       the corners stay pinned and only the curve between them deepens or
       flattens. That one transform is every expression in the set.
       non-scaling-stroke keeps a deep smile from also being a fat one. -->
  <g transform="translate(32 48.9)">
    <animateTransform attributeName="transform" attributeType="XML" type="scale"
      additive="sum" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0; 0.16; 0.30; 0.80; 0.90; 1"
      values="1 0.25; 1 0.25; 1 1.35; 1 1.35; 1 0.25; 1 0.25"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <path d="M -11 0 Q 0 4.2 11 0" fill="none" stroke="var(--gp-bg, #FDFBF7)"
          stroke-width="2.6" stroke-linecap="round" opacity=".6"
          vector-effect="non-scaling-stroke"/>
  </g>
</svg>
