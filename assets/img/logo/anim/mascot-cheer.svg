<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="The CurioZoo mascot cheering">
  <title>CurioZoo mascot — cheer</title>
  <desc>The mascot crouches, hops above the wall with happy closed eyes and three sparkles, then lands. Loops.</desc>

  <!-- The reward face. Used after a right answer. See mascot-peek.svg for why
       this is SMIL. One cycle is 2.6s.

       The hop is crouch, leap, hang, land, squash, rest. Dropping the crouch
       and the squash and just moving the head up and down looked like a lift
       in a shaft; the two extra frames are what make it a jump.

       Happy eyes are a second pair of shapes cross-faded in, not the round
       eyes bent: a bent circle reads as a squint or a wince.

       Only the pupils swap. The white disc stays in every mood, because it is
       the one part of this mascot that is white whatever it is dropped on, and
       so the only safe thing to draw dark ink on. Replacing the whole eye with
       a bold arc was more readable and then vanished on any dark page. -->

  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      dur="2.6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;  0.08; 0.14;   0.30;   0.44; 0.50;   0.56; 1"
      values="0 0; 0 2; 0 -8.5; 0 -8.5; 0 0; 0 1.6; 0 0; 0 0"
      keySplines="0.4 0 0.6 1; 0.1 0.8 0.3 1; 0 0 1 1; 0.5 0 0.9 0.6; 0.4 0 0.6 1; 0.3 0 0.4 1; 0 0 1 1"/>

    <!-- Ears fly up on the leap and flop on the landing. -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.08; 0.16; 0.30; 0.46; 0.54; 0.62; 1"
        values="0 19 19; 6 19 19; -14 19 19; -14 19 19; 9 19 19; -4 19 19; 0 19 19; 0 19 19"/>
      <circle cx="19" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.08; 0.16; 0.30; 0.46; 0.54; 0.62; 1"
        values="0 45 19; -6 45 19; 14 45 19; 14 45 19; -9 45 19; 4 45 19; 0 45 19; 0 45 19"/>
      <circle cx="45" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/>
    </g>

    <circle cx="21.5" cy="27" r="11" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>
    <circle cx="42.5" cy="27" r="11" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>

    <!-- Pupils: on the ground only. -->
    <g>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.09; 0.13; 0.48; 0.54; 1" values="1; 1; 0; 0; 1; 1"/>
      <circle cx="24.5" cy="25.5" r="4.6" fill="#2B2926"/>
      <circle cx="45.5" cy="25.5" r="4.6" fill="#2B2926"/>
      <circle cx="26.3" cy="23.6" r="1.6" fill="#FFFFFF"/>
      <circle cx="47.3" cy="23.6" r="1.6" fill="#FFFFFF"/>
    </g>

    <!-- Happy eyes: in the air only. -->
    <g fill="none" stroke="#2B2926" stroke-width="3.2" stroke-linecap="round">
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.09; 0.13; 0.48; 0.54; 1" values="0; 0; 1; 1; 0; 0"/>
      <path d="M15 29.5 Q21.5 21 28 29.5"/>
      <path d="M36 29.5 Q42.5 21 49 29.5"/>
    </g>
  </g>

  <!-- Sparkles. Three, not a burst: the design system asks for calm, and a
       burst at 24 pixels is a smudge anyway. -->
  <g fill="var(--gp-accent, #BA5828)">
    <g transform="translate(9.5 15)">
      <animateTransform attributeName="transform" attributeType="XML" type="scale"
        dur="2.6s" repeatCount="indefinite" additive="sum"
        keyTimes="0; 0.14; 0.26; 0.42; 1" values="0; 0; 1.15; 0; 0"/>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.14; 0.26; 0.42; 1" values="0; 0; 1; 0; 0"/>
      <path d="M0 -4.4 Q0.8 -0.8 4.4 0 Q0.8 0.8 0 4.4 Q-0.8 0.8 -4.4 0 Q-0.8 -0.8 0 -4.4 Z"/>
    </g>
    <g transform="translate(32 5)">
      <animateTransform attributeName="transform" attributeType="XML" type="scale"
        dur="2.6s" repeatCount="indefinite" additive="sum"
        keyTimes="0; 0.18; 0.30; 0.46; 1" values="0; 0; 1.3; 0; 0"/>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.18; 0.30; 0.46; 1" values="0; 0; 1; 0; 0"/>
      <path d="M0 -4.4 Q0.8 -0.8 4.4 0 Q0.8 0.8 0 4.4 Q-0.8 0.8 -4.4 0 Q-0.8 -0.8 0 -4.4 Z"/>
    </g>
    <g transform="translate(54.5 15)">
      <animateTransform attributeName="transform" attributeType="XML" type="scale"
        dur="2.6s" repeatCount="indefinite" additive="sum"
        keyTimes="0; 0.15; 0.28; 0.44; 1" values="0; 0; 1.15; 0; 0"/>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
        keyTimes="0; 0.15; 0.28; 0.44; 1" values="0; 0; 1; 0; 0"/>
      <path d="M0 -4.4 Q0.8 -0.8 4.4 0 Q0.8 0.8 0 4.4 Q-0.8 0.8 -4.4 0 Q-0.8 -0.8 0 -4.4 Z"/>
    </g>
  </g>

  <path d="M 15 46 Q 32 56 49 46" fill="none" stroke="var(--gp-accent, #BA5828)"
        stroke-width="22" stroke-linecap="round"/>
  <path d="M 21 48.9 Q 32 53.1 43 48.9" fill="none" stroke="var(--gp-bg, #FDFBF7)"
        stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
</svg>
