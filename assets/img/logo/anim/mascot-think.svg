<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="The CurioZoo mascot thinking">
  <title>CurioZoo mascot — think</title>
  <desc>The mascot looks up while three dots pulse above its head. Loops. Use it in place of a spinner.</desc>

  <!-- The waiting state. A spinner tells a child nothing is happening; a
       creature looking up and counting to itself tells them something is.
       See mascot-peek.svg for why this is SMIL. One cycle is 3s. -->

  <g>
    <!-- Slow lean, as if working it out. -->
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      dur="3s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0; 0.5; 1" values="-3 32 40; 3 32 40; -3 32 40"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Ears droop and stay drooped: attention is pointed elsewhere. -->
    <g transform="rotate(14 19 19)"><circle cx="19" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/></g>
    <g transform="rotate(-14 45 19)"><circle cx="45" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/></g>

    <ellipse cx="21.5" cy="27" rx="11" ry="11" fill="#FFFFFF" stroke="#2B2926"
             stroke-width="2.6" vector-effect="non-scaling-stroke">
      <animate attributeName="ry" dur="3s" repeatCount="indefinite"
        keyTimes="0; 0.80; 0.83; 0.86; 1" values="11; 11; 0.9; 11; 11"/>
    </ellipse>
    <ellipse cx="42.5" cy="27" rx="11" ry="11" fill="#FFFFFF" stroke="#2B2926"
             stroke-width="2.6" vector-effect="non-scaling-stroke">
      <animate attributeName="ry" dur="3s" repeatCount="indefinite"
        keyTimes="0; 0.80; 0.83; 0.86; 1" values="11; 11; 0.9; 11; 11"/>
    </ellipse>

    <!-- Pupils parked up and left, drifting slightly. Eyes locked dead still
         read as a stare; a small drift reads as thought. -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="3s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0; 0.5; 1" values="-3.4 -3.2; -1.4 -3.6; -3.4 -3.2"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse cx="24.5" cy="25.5" rx="4.6" ry="4.6" fill="#2B2926">
        <animate attributeName="ry" dur="3s" repeatCount="indefinite"
          keyTimes="0; 0.80; 0.83; 0.86; 1" values="4.6; 4.6; 0.3; 4.6; 4.6"/>
      </ellipse>
      <ellipse cx="45.5" cy="25.5" rx="4.6" ry="4.6" fill="#2B2926">
        <animate attributeName="ry" dur="3s" repeatCount="indefinite"
          keyTimes="0; 0.80; 0.83; 0.86; 1" values="4.6; 4.6; 0.3; 4.6; 4.6"/>
      </ellipse>
      <circle cx="26.3" cy="23.6" r="1.6" fill="#FFFFFF">
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
          keyTimes="0; 0.80; 0.83; 0.86; 1" values="1; 1; 0; 1; 1"/>
      </circle>
      <circle cx="47.3" cy="23.6" r="1.6" fill="#FFFFFF">
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
          keyTimes="0; 0.80; 0.83; 0.86; 1" values="1; 1; 0; 1; 1"/>
      </circle>
    </g>
  </g>

  <!-- Three dots, one after the other, in the clear band above the ears. -->
  <g fill="var(--gp-accent, #BA5828)">
    <circle cx="26" cy="4" r="2.4">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
        keyTimes="0; 0.08; 0.30; 0.55; 1" values="0.15; 1; 1; 0.15; 0.15"/>
    </circle>
    <circle cx="32" cy="4" r="2.4">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
        keyTimes="0; 0.16; 0.38; 0.63; 1" values="0.15; 0.15; 1; 0.15; 0.15"/>
    </circle>
    <circle cx="38" cy="4" r="2.4">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
        keyTimes="0; 0.24; 0.46; 0.71; 1" values="0.15; 0.15; 1; 0.15; 0.15"/>
    </circle>
  </g>

  <rect x="4" y="36" width="56" height="22" rx="9" fill="var(--gp-accent, #BA5828)"/>
  <path d="M18 41.5v11M32 41.5v11M46 41.5v11" fill="none" stroke="var(--gp-bg, #FDFBF7)"
        stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
</svg>
