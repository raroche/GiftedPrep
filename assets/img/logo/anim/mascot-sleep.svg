<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="The CurioZoo mascot asleep">
  <title>CurioZoo mascot — sleep</title>
  <desc>The mascot dozes behind the wall, breathing slowly, with three z letters drifting up. Loops.</desc>

  <!-- For an idle app, an empty progress screen, or the end of a long session.
       See mascot-peek.svg for why this is SMIL. One cycle is 4s. -->

  <g>
    <!-- Breathing: the whole head rises and falls by two units. Nothing else
         moves. Anything faster stops reading as sleep. -->
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      dur="4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0; 0.5; 1" values="0 0; 0 2.2; 0 0"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <g transform="rotate(20 19 19)"><circle cx="19" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/></g>
    <g transform="rotate(-20 45 19)"><circle cx="45" cy="14" r="5.4" fill="var(--gp-accent, #BA5828)"/></g>

    <!-- Shut eyes are an arc curving down inside the white disc, not a
         flattened circle: a flat circle is a straight line, which reads as a
         robot. The disc stays because dark ink is only legible on it; on a
         dark page the arcs alone disappear. -->
    <circle cx="21.5" cy="27" r="11" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>
    <circle cx="42.5" cy="27" r="11" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.6"/>
    <g fill="none" stroke="#2B2926" stroke-width="3.2" stroke-linecap="round">
      <path d="M15 25 Q21.5 31.5 28 25"/>
      <path d="M36 25 Q42.5 31.5 49 25"/>
    </g>
  </g>

  <!-- Three z letters, each drifting up and right and fading out. They start
       at x=52.5, clear of the right eye, which reaches x=53.5 at its widest;
       the first draft started them at 46 and drew them through it. -->
  <g fill="none" stroke="var(--gp-accent, #BA5828)" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(52.5 26)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="4s" repeatCount="indefinite" additive="sum"
        keyTimes="0; 1" values="0 0; 5 -21"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        keyTimes="0; 0.15; 0.75; 1" values="0; 1; 1; 0"/>
      <path d="M0 0 h5.5 l-5.5 6.5 h5.5" transform="scale(0.85)"/>
    </g>
    <g transform="translate(52.5 26)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="4s" repeatCount="indefinite" additive="sum" begin="-1.33s"
        keyTimes="0; 1" values="0 0; 5 -21"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" begin="-1.33s"
        keyTimes="0; 0.15; 0.75; 1" values="0; 1; 1; 0"/>
      <path d="M0 0 h5.5 l-5.5 6.5 h5.5" transform="scale(0.85)"/>
    </g>
    <g transform="translate(52.5 26)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="4s" repeatCount="indefinite" additive="sum" begin="-2.66s"
        keyTimes="0; 1" values="0 0; 5 -21"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" begin="-2.66s"
        keyTimes="0; 0.15; 0.75; 1" values="0; 1; 1; 0"/>
      <path d="M0 0 h5.5 l-5.5 6.5 h5.5" transform="scale(0.85)"/>
    </g>
  </g>

  <path d="M 15 46 Q 32 56 49 46" fill="none" stroke="var(--gp-accent, #BA5828)"
        stroke-width="22" stroke-linecap="round"/>
  <!-- The mouth. The seam is drawn about the origin and the group carries the
       translate, so an additive scale here pivots on the seam's end points:
       the corners stay pinned and only the curve between them deepens or
       flattens. That one transform is every expression in the set.
       non-scaling-stroke keeps a deep smile from also being a fat one. -->
  <g transform="translate(32 48.9)">
    <animateTransform attributeName="transform" attributeType="XML" type="scale"
      additive="sum" dur="4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0; 0.5; 1"
      values="1 0.95; 1 1.15; 1 0.95"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <path d="M -11 0 Q 0 4.2 11 0" fill="none" stroke="var(--gp-bg, #FDFBF7)"
          stroke-width="2.6" stroke-linecap="round" opacity=".6"
          vector-effect="non-scaling-stroke"/>
  </g>
</svg>
